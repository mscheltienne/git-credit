version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # Its version refs pick the Rust toolchain, such as the MSRV pin in ci.yaml.
      - dependency-name: dtolnay/rust-toolchain
